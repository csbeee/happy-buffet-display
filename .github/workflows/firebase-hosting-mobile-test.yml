name: Firebase Test Environment Deploy

# Manual-only test deployment. This workflow refuses the production project.
on:
  workflow_dispatch:

jobs:
  deploy_test:
    name: Deploy rules, functions and mobile preview to test Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected test branch
        uses: actions/checkout@v4

      - name: Validate isolated test project secrets
        env:
          TEST_PROJECT_ID: ${{ secrets.FIREBASE_TEST_PROJECT_ID }}
          TEST_TOKEN: ${{ secrets.FIREBASE_TEST_TOKEN }}
        run: |
          if [ -z "$TEST_PROJECT_ID" ] || [ -z "$TEST_TOKEN" ]; then
            echo "Missing FIREBASE_TEST_PROJECT_ID or FIREBASE_TEST_TOKEN. No deployment performed."
            exit 1
          fi
          if [ "$TEST_PROJECT_ID" != "happybuffet-test" ]; then
            echo "Refusing deployment: this workflow is restricted to happybuffet-test."
            exit 1
          fi
          if [ "$TEST_PROJECT_ID" = "todaymenu-30fe7" ]; then
            echo "Production deployment is forbidden in this workflow."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install --global firebase-tools
          npm install --prefix functions --no-audit --no-fund

      - name: Validate backend JavaScript
        run: node --check functions/index.js

      - name: Deploy Firestore rules and callable Cloud Functions to test only
        env:
          TEST_PROJECT_ID: ${{ secrets.FIREBASE_TEST_PROJECT_ID }}
          TEST_TOKEN: ${{ secrets.FIREBASE_TEST_TOKEN }}
        run: firebase deploy --only firestore:rules,functions --project "$TEST_PROJECT_ID" --token "$TEST_TOKEN" --non-interactive

      - name: Deploy mobile preview channel to test only
        env:
          TEST_PROJECT_ID: ${{ secrets.FIREBASE_TEST_PROJECT_ID }}
          TEST_TOKEN: ${{ secrets.FIREBASE_TEST_TOKEN }}
        run: firebase hosting:channel:deploy mobile-test --project "$TEST_PROJECT_ID" --token "$TEST_TOKEN" --expires 30d
