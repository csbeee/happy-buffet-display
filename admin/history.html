<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 이력 | 행복을 담은 한식뷔페</title>
  <link rel="stylesheet" href="./history.css">
</head>
<body>
  <header class="history-header">
    <div>
      <h1>메뉴 이력</h1>
      <p>저장했던 메뉴를 날짜별로 확인할 수 있습니다.</p>
    </div>
    <nav class="header-links">
      <a class="back-link" href="./recommendations.html">추천 메뉴·통계</a>
      <a class="back-link" href="./index.html">← 관리자 화면</a>
    </nav>
  </header>

  <main class="history-main">
    <section class="filters">
      <label for="dateFilter">날짜로 찾기</label>
      <input id="dateFilter" type="date">
      <button id="filterBtn" type="button">검색</button>
      <button id="clearBtn" type="button" class="secondary">전체 보기</button>
      <button id="refreshBtn" type="button" class="secondary">새로고침</button>
    </section>

    <div id="status" class="status" role="status">이력을 불러오는 중입니다.</div>
    <section id="historyList" class="history-list" aria-live="polite"></section>
    <button id="moreBtn" class="more-btn" type="button" hidden>더 불러오기</button>
  </main>

  <script type="module" src="./history.js"></script>
</body>
</html>
