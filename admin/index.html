<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Buffet Display Admin v4.5.1</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="topbar">
    <div>
        <h1>행복을 담은 한식뷔페</h1>
        <span>관리자 v4.5.1 Stable</span>
    </div>
    <div class="topButtons">
        <button id="resetBtn">초기화</button>
        <button id="libraryBtn">메뉴 라이브러리</button>
        <button type="button" onclick="location.href='./history.html'">메뉴 이력</button>
        <button type="button" onclick="location.href='./recommendations.html'">추천 메뉴·통계</button>
    </div>
</header>

<section class="saveArea">
    <span id="saveInfo">저장 기록 없음</span>
</section>

<section class="displayModeArea">
    <div class="displayModeHeader">
        <h2>전광판 모드</h2>
    </div>
    <div class="displayModeButtons">
        <button id="lunchModeBtn" class="modeBtn active" type="button">점심 메뉴</button>
        <button id="dinnerModeBtn" class="modeBtn" type="button">저녁 메뉴</button>
        <button id="specialModeBtn" class="modeBtn" type="button">스페셜데이</button>
    </div>
</section>

<div id="normalMenuEditor">
    <main class="page">
        <section id="menuContainer" class="menuContainer"></section>
    </main>
</div>

<section id="dinnerEditor" class="dinner-editor">
  <div class="concept-editor-header"><h2>저녁 메뉴 설정</h2><p>아래 메뉴는 저녁용으로 별도 준비한 메뉴입니다. 점심 잔여 메뉴는 아래 목록에서 선택하세요.</p></div>
  <div class="dinner-grid">
    <div class="editor-group"><label for="dinnerSoup">저녁 국</label><textarea id="dinnerSoup" rows="2" placeholder="저녁용 국 메뉴를 한 줄씩 입력"></textarea></div>
    <div class="editor-group"><label for="dinnerMain">저녁 메인 메뉴</label><textarea id="dinnerMain" rows="3" placeholder="저녁용 메인 메뉴를 한 줄씩 입력"></textarea></div>
    <div class="editor-group"><label for="dinnerSide">저녁 반찬</label><textarea id="dinnerSide" rows="4" placeholder="저녁용 반찬을 한 줄씩 입력"></textarea></div>
    <div class="editor-group"><label for="dinnerKimchi">저녁 김치</label><textarea id="dinnerKimchi" rows="2" placeholder="저녁용 김치 메뉴를 한 줄씩 입력"></textarea></div>
    <div class="editor-group"><label for="dinnerDessert">저녁 후식</label><textarea id="dinnerDessert" rows="2" placeholder="저녁용 후식을 한 줄씩 입력"></textarea></div>
    <div class="editor-group"><label for="dinnerNotice">저녁 공지</label><textarea id="dinnerNotice" rows="2" placeholder="저녁 공지사항 (선택)"></textarea></div>
  </div>
  <div class="leftover-panel"><h3>점심 잔여 메뉴 — 저녁에도 제공</h3><p>체크한 메뉴는 저녁 잔여 메뉴로 표시됩니다. 별도 저녁 메뉴로 중복 입력하지 마세요.</p><div id="dinnerLeftoverChoices" class="leftover-choices"></div></div>
</section>

<div id="conceptEditor" class="concept-editor hidden">
    <div class="concept-editor-header">
        <h2>특별 컨셉데이 설정</h2>
        <p>오늘의 특별 메뉴 컨셉을 설정하세요.</p>
    </div>

    <div class="editor-group">
        <label for="conceptTheme">컨셉 선택</label>
        <select id="conceptTheme">
            <option value="bibimbap">🍚 비빔밥데이</option>
            <option value="bunsik">🍢 분식데이</option>
            <option value="chicken">🍗 치킨데이</option>
            <option value="pizza">🍕 피자데이</option>
            <option value="noodle">🍜 면요리데이</option>
            <option value="barbecue">🥩 고기데이</option>
            <option value="seafood">🐟 해산물데이</option>
            <option value="custom">⭐ 직접 설정</option>
        </select>
    </div>

    <div class="editor-group">
        <label for="conceptSubtitle">소개 문구</label>
        <input id="conceptSubtitle" type="text" placeholder="예: 오늘은 내가 만드는 비빔밥!">
    </div>

    <div class="concept-sections-header">
        <h3>특별 메뉴 구성</h3>
        <button id="addConceptSectionBtn" type="button" class="primary">+ 섹션 추가</button>
    </div>

    <div id="conceptSectionsList" class="concept-sections-list"></div>
</div>

<footer class="bottomBar">
    <button id="previewBtn">미리보기</button>
    <button id="saveBtn" class="primary">저장</button>
</footer>

<div id="libraryModal" class="modal">
    <div class="modalBox">
        <div class="modalHeader">
            <h2>메뉴 라이브러리</h2>
            <button id="closeLibrary">✕</button>
        </div>
        <div class="libraryHeader">
            <input id="librarySearch" type="text" placeholder="메뉴 검색">
            <button id="libraryAdd" class="primary">+ 메뉴 추가</button>
        </div>
        <div class="libraryToolbar">
            <select id="libraryCategory">
                <option value="all">전체</option>
                <option value="main">메인</option>
                <option value="soup">국/찌개</option>
                <option value="side">반찬</option>
                <option value="kimchi">김치</option>
                <option value="extra">추가반찬</option>
                <option value="dessert">후식</option>
            </select>
        </div>
        <div id="libraryList" class="libraryList"></div>
    </div>
</div>

<div id="editorModal" class="modal">
    <div class="editorModal">
        <h2 id="editorTitle">메뉴 추가</h2>
        <div class="editorGroup">
            <label>메뉴명</label>
            <input id="menuName" type="text">
        </div>
        <div class="editorGroup">
            <label>카테고리</label>
            <select id="menuCategory">
                <option value="main">메인</option>
                <option value="soup">국/찌개</option>
                <option value="side">반찬</option>
                <option value="kimchi">김치</option>
                <option value="extra">추가반찬</option>
                <option value="dessert">후식</option>
            </select>
        </div>
        <div class="editorGroup">
            <label>원가등급</label>
            <select id="menuCost">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <div class="editorActions">
            <button id="editorCancel">취소</button>
            <button id="editorSave" class="primary">저장</button>
        </div>
    </div>
</div>

<div id="loading" class="loading hidden">저장 중...</div>

<!-- menu-ui.js의 initMenuUI()는 Sortable 전역 객체를 사용합니다. -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
