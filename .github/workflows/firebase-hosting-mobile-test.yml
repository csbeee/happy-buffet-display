name: Firebase Test Hosting Preview

# Manual-only preview deployment. Spark/free compatible: Hosting only.
# This workflow never deploys Cloud Functions, Firestore rules, or production.
on:
  workflow_dispatch:

jobs:
  deploy_test_hosting:
    name: Deploy admin/menu preview to happybuffet-test Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected test branch
        uses: actions/checkout@v4

      - name: Validate isolated test project secrets
        env:
          TEST_PROJECT_ID: ${{ secrets.FIREBASE_TEST_PROJECT_ID }}
          TEST_TOKEN: ${{ secrets.FIREBASE_TEST_TOKEN }}
        run: |
          if [ -z "$TEST_PROJECT_ID" ] || [ -z "$TEST_TOKEN" ]; then
            echo "Missing test Firebase secrets. No deployment performed."
            exit 1
          fi
          if [ "$TEST_PROJECT_ID" != "happybuffet-test" ]; then
            echo "Refusing deployment: only happybuffet-test is allowed."
            exit 1
          fi
          if [ "$TEST_PROJECT_ID" = "todaymenu-30fe7" ]; then
            echo "Production deployment is forbidden."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy preview channel to test Hosting only
        env:
          TEST_PROJECT_ID: ${{ secrets.FIREBASE_TEST_PROJECT_ID }}
          TEST_TOKEN: ${{ secrets.FIREBASE_TEST_TOKEN }}
        run: firebase hosting:channel:deploy mobile-test --project "$TEST_PROJECT_ID" --token "$TEST_TOKEN" --expires 30d --non-interactive
