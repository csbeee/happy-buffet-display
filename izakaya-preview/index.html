<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>오늘의 추천 메뉴 - 달빛포차</title>
  <style>
    :root {
      --bg: #101010;
      --panel: #1b1b1b;
      --gold: #e5a93b;
      --gold-soft: #f0c56d;
      --text: #f5f3ee;
      --muted: #aaa69d;
      --line: #33312d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    body {
      background: radial-gradient(circle at 75% 15%, rgba(229,169,59,.08), transparent 28%), #101010;
      color: var(--text);
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    .screen {
      width: 100%;
      min-height: 100vh;
      padding: 3.2vh 3.2vw 2.4vh;
      display: flex;
      flex-direction: column;
    }
    header {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      margin-bottom: 3vh;
      gap: 20px;
    }
    .brand-wrap { display: flex; align-items: baseline; gap: 22px; }
    .brand-title {
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 3vw, 58px);
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .brand-sub {
      color: #77736b;
      font-size: clamp(14px, 1.1vw, 21px);
      letter-spacing: 3px;
    }
    .today-date { color: var(--muted); font-size: clamp(18px, 1.4vw, 28px); white-space: nowrap; }
    main { flex: 1; display: grid; grid-template-columns: 2fr 1fr; gap: 2vw; min-height: 0; }
    .section-heading {
      display: flex; align-items: center; gap: 12px;
      color: var(--gold-soft); font-size: clamp(22px, 1.7vw, 34px);
      font-weight: 700; margin-bottom: 1.5vh;
    }
    .section-heading small { color: #77736b; font-size: .48em; font-weight: 500; letter-spacing: 2px; }
    .dishes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5vw; }
    .menu-card {
      min-width: 0; background: linear-gradient(180deg, #202020, #181818);
      border: 1px solid #302f2c; border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 16px 35px rgba(0,0,0,.22);
    }
    .menu-image-wrap { position: relative; height: 380px; overflow: hidden; background: #292929; }
    .menu-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .menu-image-wrap::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.35)); }
    .badge { position: absolute; z-index: 2; top: 18px; right: 18px; padding: 8px 15px; border-radius: 999px; background: var(--gold); color: #17130b; font-size: clamp(13px,.9vw,18px); font-weight: 800; }
    .menu-info { padding: 2.2vh 2vw; }
    .menu-header { display: flex; align-items: baseline; justify-content: space-between; gap: 15px; margin-bottom: 1vh; }
    .menu-name { min-width: 0; font-size: clamp(25px,2vw,39px); font-weight: 800; line-height: 1.25; }
    .menu-price { flex: 0 0 auto; color: var(--gold); font-size: clamp(22px,1.6vw,32px); font-weight: 800; }
    .menu-desc { color: var(--muted); font-size: clamp(15px,1.1vw,22px); line-height: 1.65; }
    .drinks-container { display: flex; flex-direction: column; gap: 1.2vh; }
    .drink-card { min-height: 0; background: linear-gradient(180deg,#202020,#181818); border: 1px solid #302f2c; border-radius: 14px; padding: 1.2vh 1.1vw; display: flex; align-items: center; gap: 1vw; }
    .drink-img { width: clamp(70px,5vw,105px); height: clamp(90px,13vh,145px); object-fit: contain; flex: 0 0 auto; }
    .drink-info { min-width: 0; }
    .drink-type { color: var(--gold); font-size: clamp(12px,.8vw,16px); font-weight: 700; letter-spacing: 2px; margin-bottom: .5vh; }
    .drink-name { font-size: clamp(19px,1.35vw,27px); font-weight: 800; margin-bottom: .5vh; }
    .drink-desc { color: var(--muted); font-size: clamp(13px,.85vw,17px); line-height: 1.45; margin-bottom: .7vh; }
    .drink-price { font-size: clamp(16px,1.05vw,21px); font-weight: 800; }
    footer { min-height: 48px; margin-top: 2vh; padding-top: 1.3vh; border-top: 1px solid var(--line); display: flex; justify-content: space-between; color: #77736b; font-size: clamp(12px,.75vw,16px); }

    /* Mobile preview */
    @media (max-width: 768px) {
      body { background: #101010; }
      .screen { padding: 20px 16px 24px; min-height: 100dvh; }
      header { min-height: auto; margin-bottom: 24px; padding-bottom: 18px; flex-direction: column; align-items: flex-start; }
      .brand-wrap { flex-direction: column; align-items: flex-start; gap: 5px; }
      .brand-title { font-size: clamp(32px, 9vw, 48px); letter-spacing: 2px; }
      .brand-sub { font-size: 11px; letter-spacing: 2px; }
      .today-date { font-size: 15px; }
      main { display: flex; flex-direction: column; gap: 30px; }
      .section-heading { font-size: 22px; margin-bottom: 12px; }
      .section-heading small { font-size: 10px; letter-spacing: 1px; }
      .dishes-grid { grid-template-columns: 1fr; gap: 16px; }
      .menu-card { border-radius: 14px; }
      .menu-image-wrap { height: min(58vw, 320px); }
      .menu-info { padding: 18px; }
      .menu-header { flex-direction: column; align-items: flex-start; gap: 5px; }
      .menu-name { font-size: clamp(24px, 7vw, 32px); }
      .menu-price { font-size: 21px; }
      .menu-desc { font-size: 15px; }
      .drinks-container { gap: 12px; }
      .drink-card { padding: 12px; gap: 12px; }
      .drink-img { width: 70px; height: 100px; }
      .drink-name { font-size: 19px; }
      .drink-desc { font-size: 13px; }
      footer { margin-top: 28px; flex-direction: column; gap: 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand-wrap">
        <div class="brand-title">달빛포차</div>
        <div class="brand-sub">DALBIT POCHA · TODAY MENU</div>
      </div>
      <div class="today-date" id="current-date">TODAY'S SPECIAL</div>
    </header>

    <main>
      <section>
        <div class="section-heading">🍣 오늘의 추천 요리 <small>CHEF'S RECOMMENDATION</small></div>
        <div class="dishes-grid" id="dishes-container"></div>
      </section>
      <section>
        <div class="section-heading">🍶 추천 페어링 주류 <small>PAIRING</small></div>
        <div class="drinks-container" id="drinks-container"></div>
      </section>
    </main>

    <footer>
      <div>원산지: 광어(국내산) · 연어(노르웨이) · 한우(국내산)</div>
      <div>DALBIT POCHA · TODAY MENU DISPLAY</div>
    </footer>
  </div>

  <script>
    const dishes = [
      { name: "제철 모둠 사시미 (M)", price: "55,000원", desc: "당일 입고된 싱싱한 5종 생선과 전복, 참치, 연어 구성", badge: "BEST", img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=1000&q=85" },
      { name: "숯불 와규 구이 (A4)", price: "48,000원", desc: "육즙 가득한 최고급 와규 숯불구이와 고추냉이, 특제 소스", badge: "CHEF'S PICK", img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1000&q=85" }
    ];
    const drinks = [
      { type: "SAKE", name: "쿠보타 센주", price: "100,000원", desc: "깔끔하고 화사한 향, 회와 최상의 궁합", img: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=300&q=85" },
      { type: "HIGHBALL", name: "시그니처 달빛 하이볼", price: "12,000원", desc: "달콤하고 상큼한 달빛포차 시그니처", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=300&q=85" },
      { type: "BEER", name: "생맥주", price: "6,000원", desc: "추천 요리와 가볍게 즐기는 시원한 생맥주", img: "https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=300&q=85" }
    ];
    function renderDishes(items) {
      document.getElementById("dishes-container").innerHTML = items.map(item => `
        <article class="menu-card">
          <div class="menu-image-wrap">${item.badge ? `<div class="badge">${item.badge}</div>` : ""}<img class="menu-img" src="${item.img}" alt="${item.name}"></div>
          <div class="menu-info"><div class="menu-header"><div class="menu-name">${item.name}</div><div class="menu-price">${item.price}</div></div><div class="menu-desc">${item.desc}</div></div>
        </article>`).join("");
    }
    function renderDrinks(items) {
      document.getElementById("drinks-container").innerHTML = items.map(item => `
        <article class="drink-card"><img class="drink-img" src="${item.img}" alt="${item.name}"><div class="drink-info"><div class="drink-type">${item.type}</div><div class="drink-name">${item.name}</div><div class="drink-desc">${item.desc}</div><div class="drink-price">${item.price}</div></div></article>`).join("");
    }
    const now = new Date();
    document.getElementById("current-date").textContent = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")} · TODAY'S SPECIAL`;
    renderDishes(dishes);
    renderDrinks(drinks);
  </script>
</body>
</html>
