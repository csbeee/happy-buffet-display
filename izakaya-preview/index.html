<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>오늘의 추천 메뉴 - 이자카야 櫻</title>
  <style>
    :root {
      --bg: #101010;
      --panel: #1b1b1b;
      --panel-2: #202020;
      --gold: #e5a93b;
      --gold-soft: #f0c56d;
      --text: #f5f3ee;
      --muted: #aaa69d;
      --line: #33312d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; height: 100%; }

    body {
      min-width: 1280px;
      min-height: 720px;
      background:
        radial-gradient(circle at 75% 15%, rgba(229,169,59,.08), transparent 28%),
        linear-gradient(135deg, #0e0e0e 0%, #151515 55%, #0e0e0e 100%);
      color: var(--text);
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      overflow: hidden;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      padding: 3.2vh 3.2vw 2.4vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 10vh;
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      margin-bottom: 3vh;
    }

    .brand-wrap { display: flex; align-items: baseline; gap: 22px; }

    .brand-title {
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 3vw, 58px);
      font-weight: 700;
      letter-spacing: 3px;
    }

    .brand-sub {
      color: #77736b;
      font-size: clamp(14px, 1.1vw, 21px);
      letter-spacing: 3px;
    }

    .today-date {
      color: var(--muted);
      font-size: clamp(18px, 1.4vw, 28px);
      letter-spacing: 1px;
    }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2vw;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--gold-soft);
      font-size: clamp(22px, 1.7vw, 34px);
      font-weight: 700;
      margin-bottom: 1.5vh;
    }

    .section-heading small {
      color: #77736b;
      font-size: .48em;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .dishes-grid {
      height: calc(100% - 55px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5vw;
    }

    .menu-card {
      min-width: 0;
      background: linear-gradient(180deg, #202020, #181818);
      border: 1px solid #302f2c;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 35px rgba(0,0,0,.22);
    }

    .menu-image-wrap {
      position: relative;
      height: 53%;
      overflow: hidden;
      background: #292929;
    }

    .menu-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .menu-image-wrap::after {
      content: "";
      position: absolute;
      inset: 45% 0 0;
      background: linear-gradient(transparent, rgba(0,0,0,.35));
      pointer-events: none;
    }

    .badge {
      position: absolute;
      z-index: 2;
      top: 18px;
      right: 18px;
      padding: 8px 15px;
      border-radius: 999px;
      background: var(--gold);
      color: #17130b;
      font-size: clamp(13px, .9vw, 18px);
      font-weight: 800;
      letter-spacing: .5px;
    }

    .menu-info {
      flex: 1;
      padding: 2.2vh 2vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 1vh;
    }

    .menu-name {
      min-width: 0;
      font-size: clamp(25px, 2vw, 39px);
      font-weight: 800;
      line-height: 1.25;
    }

    .menu-price {
      flex: 0 0 auto;
      color: var(--gold);
      font-size: clamp(22px, 1.6vw, 32px);
      font-weight: 800;
    }

    .menu-desc {
      color: var(--muted);
      font-size: clamp(15px, 1.1vw, 22px);
      line-height: 1.65;
    }

    .drinks-container {
      height: calc(100% - 55px);
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
      overflow: hidden;
    }

    .drink-card {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, #202020, #181818);
      border: 1px solid #302f2c;
      border-radius: 14px;
      padding: 1.2vh 1.1vw;
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .drink-img {
      width: clamp(70px, 5vw, 105px);
      height: clamp(90px, 13vh, 145px);
      object-fit: contain;
      flex: 0 0 auto;
    }

    .drink-info { min-width: 0; }

    .drink-type {
      color: var(--gold);
      font-size: clamp(12px, .8vw, 16px);
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: .5vh;
    }

    .drink-name {
      font-size: clamp(19px, 1.35vw, 27px);
      font-weight: 800;
      margin-bottom: .5vh;
    }

    .drink-desc {
      color: var(--muted);
      font-size: clamp(13px, .85vw, 17px);
      line-height: 1.45;
      margin-bottom: .7vh;
    }

    .drink-price {
      color: var(--text);
      font-size: clamp(16px, 1.05vw, 21px);
      font-weight: 800;
    }

    footer {
      height: 6vh;
      min-height: 48px;
      margin-top: 2vh;
      padding-top: 1.3vh;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #77736b;
      font-size: clamp(12px, .75vw, 16px);
    }

    @media (max-width: 1450px) {
      .screen { padding-left: 2.5vw; padding-right: 2.5vw; }
      .menu-info { padding-left: 1.5vw; padding-right: 1.5vw; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand-wrap">
        <div class="brand-title">居酒屋 櫻</div>
        <div class="brand-sub">IZAKAYA SAKURA · TODAY MENU</div>
      </div>
      <div class="today-date" id="current-date">TODAY'S SPECIAL</div>
    </header>

    <main>
      <section>
        <div class="section-heading">🍣 오늘의 추천 요리 <small>CHEF'S RECOMMENDATION</small></div>
        <div class="dishes-grid" id="dishes-container"></div>
      </section>

      <section>
        <div class="section-heading">🍶 추천 페어링 주류 <small>PAIRING</small></div>
        <div class="drinks-container" id="drinks-container"></div>
      </section>
    </main>

    <footer>
      <div>원산지: 광어(국내산) · 연어(노르웨이) · 한우(국내산)</div>
      <div>IZAKAYA SAKURA · TODAY MENU DISPLAY</div>
    </footer>
  </div>

  <script>
    const dishes = [
      {
        name: "제철 모둠 사시미 (M)",
        price: "55,000원",
        desc: "당일 입고된 싱싱한 5종 생선과 전복, 참치, 연어 구성",
        badge: "BEST",
        img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=1000&q=85"
      },
      {
        name: "숯불 와규 구이 (A4)",
        price: "48,000원",
        desc: "육즙 가득한 최고급 와규 숯불구이와 고추냉이, 특제 소스",
        badge: "CHEF'S PICK",
        img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1000&q=85"
      }
    ];

    const drinks = [
      {
        type: "SAKE",
        name: "쿠보타 센주",
        price: "100,000원",
        desc: "깔끔하고 화사한 향, 회와 최상의 궁합",
        img: "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=300&q=85"
      },
      {
        type: "HIGHBALL",
        name: "시그니처 사쿠라 하이볼",
        price: "12,000원",
        desc: "달콤하고 상큼한 이자카야 대표 시그니처",
        img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=300&q=85"
      },
      {
        type: "BEER",
        name: "생맥주",
        price: "6,000원",
        desc: "추천 요리와 가볍게 즐기는 시원한 생맥주",
        img: "https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=300&q=85"
      }
    ];

    function renderDishes(items) {
      document.getElementById("dishes-container").innerHTML = items.map(item => `
        <article class="menu-card">
          <div class="menu-image-wrap">
            ${item.badge ? `<div class="badge">${item.badge}</div>` : ""}
            <img class="menu-img" src="${item.img}" alt="${item.name}">
          </div>
          <div class="menu-info">
            <div>
              <div class="menu-header">
                <div class="menu-name">${item.name}</div>
                <div class="menu-price">${item.price}</div>
              </div>
              <div class="menu-desc">${item.desc}</div>
            </div>
          </div>
        </article>
      `).join("");
    }

    function renderDrinks(items) {
      document.getElementById("drinks-container").innerHTML = items.map(item => `
        <article class="drink-card">
          <img class="drink-img" src="${item.img}" alt="${item.name}">
          <div class="drink-info">
            <div class="drink-type">${item.type}</div>
            <div class="drink-name">${item.name}</div>
            <div class="drink-desc">${item.desc}</div>
            <div class="drink-price">${item.price}</div>
          </div>
        </article>
      `).join("");
    }

    function updateDate() {
      const now = new Date();
      const date = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, "0")}.${String(now.getDate()).padStart(2, "0")}`;
      document.getElementById("current-date").textContent = `${date} · TODAY'S SPECIAL`;
    }

    renderDishes(dishes);
    renderDrinks(drinks);
    updateDate();
  </script>
</body>
</html>
