name: Firebase Hosting Mobile Test

on:
  push:
    branches:
      - feature/meal-management-tablet
  workflow_dispatch:

jobs:
  deploy_preview:
    name: Deploy mobile test preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to isolated preview channel
        run: firebase hosting:channel:deploy mobile-test --project "${{ secrets.FIREBASE_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}" --expires 30d
