name: Sync commits to Notion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Create Notion development log
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add commit to Notion Development Log
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_LOG_DATABASE_ID: ${{ secrets.NOTION_LOG_DATABASE_ID }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node <<'NODE'
          const apiKey = process.env.NOTION_API_KEY;
          const databaseId = process.env.NOTION_LOG_DATABASE_ID;
          if (!apiKey || !databaseId) {
            throw new Error('NOTION_API_KEY 또는 NOTION_LOG_DATABASE_ID GitHub Secret이 없습니다.');
          }

          const sha = process.env.COMMIT_SHA;
          const branch = process.env.BRANCH_NAME || 'main';
          const repository = process.env.REPOSITORY;
          const commitUrl = `https://github.com/${repository}/commit/${sha}`;
          const message = (process.env.COMMIT_MESSAGE || '').split('\n')[0].trim()
            || `수동 동기화 - ${sha.slice(0, 7)}`;
          const title = message.slice(0, 180);

          async function notionRequest(path, options = {}) {
            const response = await fetch(`https://api.notion.com/v1/${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${apiKey}`,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(`Notion API ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          (async () => {
            const existing = await notionRequest(`databases/${databaseId}/query`, {
              method: 'POST',
              body: JSON.stringify({
                filter: {
                  property: 'Commit',
                  rich_text: { equals: sha }
                },
                page_size: 1
              })
            });

            if (existing.results && existing.results.length > 0) {
              console.log(`이미 Notion에 기록된 커밋입니다: ${sha}`);
              return;
            }

            await notionRequest('pages', {
              method: 'POST',
              body: JSON.stringify({
                parent: { database_id: databaseId },
                properties: {
                  Name: { title: [{ text: { content: title } }] },
                  Commit: { rich_text: [{ text: { content: sha } }] },
                  Branch: { rich_text: [{ text: { content: branch } }] },
                  Category: { select: { name: '코드 변경' } },
                  Date: { date: { start: new Date().toISOString() } },
                  'GitHub URL': { url: commitUrl }
                }
              })
            });

            console.log(`Notion 개발 기록 생성 완료: ${commitUrl}`);
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
