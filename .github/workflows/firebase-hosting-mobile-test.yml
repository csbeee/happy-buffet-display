name: Firebase Hosting Mobile Test

# Deploy only to the isolated Firebase Hosting preview channel from the dedicated test branch.
# This workflow never deploys Functions or Firestore rules.
# Required repository secrets: FIREBASE_TEST_PROJECT_ID=happybuffet-test and FIREBASE_TEST_TOKEN.

on:
  push:
    branches:
      - test/meal-management-ci-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-test-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_preview:
    name: Deploy isolated mobile test preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Validate test-only target and trigger branch
        env:
          TEST_PROJECT_ID: ${{ secrets.FIREBASE_TEST_PROJECT_ID }}
          TEST_TOKEN: ${{ secrets.FIREBASE_TEST_TOKEN }}
          DEPLOY_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_REF" != "refs/heads/test/meal-management-ci-validation" ]]; then
            echo "Refusing deployment from non-test branch: $DEPLOY_REF"
            exit 1
          fi
          if [[ "$TEST_PROJECT_ID" != "happybuffet-test" ]]; then
            echo "Refusing deployment: FIREBASE_TEST_PROJECT_ID must be exactly happybuffet-test."
            exit 1
          fi
          if [[ -z "$TEST_TOKEN" ]]; then
            echo "Missing FIREBASE_TEST_TOKEN. No deployment performed."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to isolated preview channel
        env:
          TEST_PROJECT_ID: ${{ secrets.FIREBASE_TEST_PROJECT_ID }}
          TEST_TOKEN: ${{ secrets.FIREBASE_TEST_TOKEN }}
        run: firebase hosting:channel:deploy mobile-test --project "$TEST_PROJECT_ID" --token "$TEST_TOKEN" --expires 30d
