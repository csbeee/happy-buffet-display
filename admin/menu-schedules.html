<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날짜별 메뉴 관리 | 행복을 담은 한식뷔페</title>
  <link rel="stylesheet" href="./menu-schedules.css">
</head>
<body>
  <header class="topbar">
    <div class="admin-brand">
      <h1>행복을 담은 한식뷔페</h1>
      <span>날짜별 메뉴 관리</span>
    </div>
    <nav class="topButtons" aria-label="관리자 메뉴">
      <a class="nav-button" href="./index.html">관리자 메인</a>
      <a class="nav-button" href="./history.html">메뉴 이력</a>
    </nav>
  </header>

  <main class="schedule-page">
    <section class="schedule-intro">
      <h2>날짜별 중식 · 석식 메뉴</h2>
      <p>날짜를 선택해 중식·석식 메뉴를 조회하고 수정합니다. 저장된 메뉴는 그대로 유지됩니다.</p>
    </section>

    <section id="editPanel" class="schedule-panel editor-panel" aria-labelledby="editHeading">
      <div class="panel-heading">
        <div>
          <h2 id="editHeading">날짜별 메뉴 수정</h2>
          <p>날짜를 선택한 뒤 중식·석식의 메뉴를 한 줄에 하나씩 입력하세요.</p>
        </div>
      </div>
      <div class="date-toolbar">
        <label for="dateSelect">메뉴 날짜</label>
        <select id="dateSelect"></select>
        <button id="loadDateBtn" type="button">불러오기</button>
      </div>
      <div class="meal-editor-grid">
        <section class="meal-editor">
          <h3>중식</h3>
          <label>메인 메뉴<textarea id="lunchMain" rows="3"></textarea></label>
          <label>반찬 (김치 포함)<textarea id="lunchSide" rows="6"></textarea></label>
          <label>국<textarea id="lunchSoup" rows="2"></textarea></label>
          <label>후식<textarea id="lunchDessert" rows="2"></textarea></label>
          <label>공지 · 휴무 안내<textarea id="lunchNotice" rows="2"></textarea></label>
        </section>
        <section class="meal-editor">
          <h3>석식</h3>
          <label>메인 메뉴<textarea id="dinnerMain" rows="3"></textarea></label>
          <label>반찬 (김치 포함)<textarea id="dinnerSide" rows="6"></textarea></label>
          <label>국<textarea id="dinnerSoup" rows="2"></textarea></label>
          <label>후식<textarea id="dinnerDessert" rows="2"></textarea></label>
          <label>공지 · 휴무 안내<textarea id="dinnerNotice" rows="2"></textarea></label>
        </section>
      </div>
      <div class="editor-actions">
        <button id="saveDateBtn" class="primary" type="button">선택 날짜 저장</button>
        <span id="editStatus" class="status-line" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <script type="module" src="./auth.js"></script>
  <script type="module" src="./menu-schedules.js"></script>
</body>
</html>
